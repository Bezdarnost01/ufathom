[package]
name = "ufathom-runtime"
description = "Library used by generated SDKs: containers, sessions, object access and function calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ufathom-mem.workspace = true
thiserror.workspace = true
iced-x86 = { workspace = true, optional = true }

[features]
# `InProcessExecutor`: calls game functions through ProcessEvent. Off by
# default; without it the crate never runs game code.
inproc = ["dep:libc", "dep:windows-sys"]
# `proxy`: the exports of the system version.dll, forwarded to it, so a DLL
# named version.dll beside the game is loaded at start-up. Windows only.
proxy-version = ["dep:windows-sys"]
# `detour`: inline detours of plain native functions, checked against the
# bytes the author expects. The one module that patches code; opt-in and for
# mods only. Windows x86-64 only: on other targets the module is absent.
detour = ["inproc", "dep:iced-x86"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[lints]
workspace = true
