[package]
name = "ufathom-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK generated by ufathom-codegen."
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ufathom-sdk-external"
path = "src/main.rs"

[dependencies]
ufathom-runtime = { version = "0.1.0" }
ufathom-sdk-core-uobject = { path = "crates/ufathom-sdk-core-uobject", optional = true }
ufathom-sdk-core-pkg = { path = "crates/ufathom-sdk-core-pkg", optional = true }
ufathom-sdk-engine = { path = "crates/ufathom-sdk-engine", optional = true }
ufathom-sdk-main-pkg = { path = "crates/ufathom-sdk-main-pkg", optional = true }
ufathom-sdk-std-pkg = { path = "crates/ufathom-sdk-std-pkg", optional = true }
ufathom-sdk-mods = { path = "crates/ufathom-sdk-mods", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Threading"] }

[features]
default = ["all", "accessors"]
all = ["mods", "core_pkg", "core_uobject", "engine", "main_pkg", "std_pkg"]
# Chain accessors: `object.root_component()?.relative_location()?`, as extension
# traits per class. Turn off to shorten the build; the `FIELD` constants stay.
accessors = ["ufathom-sdk-core-uobject?/accessors", "ufathom-sdk-core-pkg?/accessors", "ufathom-sdk-engine?/accessors", "ufathom-sdk-main-pkg?/accessors", "ufathom-sdk-std-pkg?/accessors", "ufathom-sdk-mods?/accessors"]
# Calls game functions through ProcessEvent: `attach()`. Inside the game only.
inproc = ["ufathom-runtime/inproc", "ufathom-sdk-core-uobject?/inproc", "ufathom-sdk-core-pkg?/inproc", "ufathom-sdk-engine?/inproc", "ufathom-sdk-main-pkg?/inproc", "ufathom-sdk-std-pkg?/inproc", "ufathom-sdk-mods?/inproc"]
# Inline detours of plain native functions (`ufathom_runtime::detour`), for mods.
# The one part that patches code. Windows x86-64 only.
detour = ["ufathom-runtime/detour", "inproc"]
# The DLL unloads itself when `run` returns, after removing its hooks.
hot-unload = []
# Name the DLL after a system DLL and put it beside the game: it exports that
# DLL's functions, forwards them to the real one and waits for the engine
# before `run`. Enable one of these, not several. Windows x86-64 only.
proxy-version = ["ufathom-runtime/proxy-version"]
proxy-dsound = ["ufathom-runtime/proxy-dsound"]
proxy-dinput8 = ["ufathom-runtime/proxy-dinput8"]
proxy-winmm = ["ufathom-runtime/proxy-winmm"]
mods = ["dep:ufathom-sdk-mods", "core_uobject", "engine"]
core_pkg = ["dep:ufathom-sdk-core-pkg", "core_uobject"]
core_uobject = ["dep:ufathom-sdk-core-uobject"]
engine = ["dep:ufathom-sdk-engine", "core_uobject"]
main_pkg = ["dep:ufathom-sdk-main-pkg", "core_uobject"]
std_pkg = ["dep:ufathom-sdk-std-pkg", "core_uobject"]

# The workspace lints are for the vendored runtime, not for generated code.
[lints]

# This crate is its own workspace, so it builds from any directory.
[workspace]
