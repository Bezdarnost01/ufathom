[package]
name = "ufathom-sdk-core-pkg"
version = "0.1.0"
edition = "2021"
description = "Packages of a Rust SDK generated by ufathom-codegen."
publish = false

[dependencies]
ufathom-runtime = { version = "0.1.0" }
ufathom-sdk-core-uobject = { path = "../ufathom-sdk-core-uobject" }

[features]
inproc = ["ufathom-runtime/inproc", "ufathom-sdk-core-uobject/inproc"]
accessors = ["ufathom-sdk-core-uobject/accessors"]
