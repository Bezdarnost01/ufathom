[package]
name = "ufathom-sdk-mods"
version = "0.1.0"
edition = "2021"
description = "Packages of a Rust SDK generated by ufathom-codegen."
publish = false

[dependencies]
ufathom-runtime = { version = "0.1.0" }
ufathom-sdk-core-uobject = { path = "../ufathom-sdk-core-uobject" }
ufathom-sdk-engine = { path = "../ufathom-sdk-engine" }

[features]
inproc = ["ufathom-runtime/inproc", "ufathom-sdk-core-uobject/inproc", "ufathom-sdk-engine/inproc"]
accessors = ["ufathom-sdk-core-uobject/accessors", "ufathom-sdk-engine/accessors"]

# The workspace lints are for the vendored runtime, not for generated code.
[lints]
