[package]
name = "ufathom-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK generated by ufathom-codegen."
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ufathom-sdk-external"
path = "src/main.rs"

[dependencies]
ufathom-runtime = { version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Threading"] }

[features]
default = ["all"]
all = ["mods", "core_pkg", "core_uobject", "engine", "main_pkg", "std_pkg"]
# Calls game functions through ProcessEvent: `attach()`. Inside the game only.
inproc = ["ufathom-runtime/inproc"]
mods = ["core_uobject", "engine"]
core_pkg = ["core_uobject"]
core_uobject = []
engine = ["core_uobject"]
main_pkg = ["core_uobject"]
std_pkg = ["core_uobject"]

# This crate is its own workspace, so it builds from any directory.
[workspace]
