[package]
name = "ufathom-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK generated by ufathom-codegen."
publish = false

[dependencies]
ufathom-runtime = { version = "0.1.0" }

[features]
default = ["all"]
all = ["mods", "core_u_object", "engine"]
mods = ["core_u_object", "engine"]
core_u_object = []
engine = ["core_u_object"]

# This crate is its own workspace, so it builds from any directory.
[workspace]
