[package]
name = "ufathom-dll"
description = "The ufathom.dll shell: DllMain, thread lifecycle, hotkeys and panic containment."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ufathom"
crate-type = ["cdylib"]

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
ufathom-agent.workspace = true
ufathom-mem.workspace = true

[target.'cfg(windows)'.dependencies]
# Module pinning and unloading, the worker thread, the per-process mutex, key
# state and the foreground window. All of it is confined to `src/os.rs`.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
ufathom-model.workspace = true
ufathom-testkit.workspace = true

[lints]
workspace = true
